name: Generate Let's Encrypt Certificate

on:
  workflow_dispatch:
    inputs:
      domains:
        description: "Comma-separated domains (e.g. example.com,*.example.com,api.example.com)"
        required: true
        type: string
      email:
        description: "Email for Let's Encrypt registration"
        required: true
        type: string

  schedule:
    # Renew every 60 days (certs last 90)
    cron: "0 3 1 */2 *"

env:
  CERT_NAME: letsencrypt-cert
  DOMAINS: ${{ inputs.domains || vars.LE_CERT_DOMAINS }}
  CERTBOT_EMAIL: ${{ inputs.email || vars.LE_CERTBOT_EMAIL }}

jobs:
  generate:
    name: Generate Certificate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          if [[ -z "${DOMAINS}" ]]; then
            echo "::error::DOMAINS is not set. Provide via workflow input or repository variables."
            exit 1
          fi
          if [[ -z "${CERTBOT_EMAIL}" ]]; then
            echo "::error::CERTBOT_EMAIL is not set. Provide via workflow input or repository variables."
            exit 1
          fi
          echo "Domains: ${DOMAINS}"
          echo "Email: ${CERTBOT_EMAIL}"

      - name: Install certbot + DNS plugin
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq certbot python3-certbot-dns-cloudflare

      - name: Generate certificate
        env:
          CF_Token: ${{ secrets.CF_API_TOKEN }}
          CF_Zone_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          chmod +x scripts/generate-cert.sh
          scripts/generate-cert.sh

      - name: Verify certificate files
        run: |
          CERT_DIR=output/certs
          echo "Verifying certificate files..."

          if [[ ! -f "${CERT_DIR}/fullchain.pem" ]]; then
            echo "::error::fullchain.pem not found"
            exit 1
          fi

          if [[ ! -f "${CERT_DIR}/private-key.pem" ]]; then
            echo "::error::private-key.pem not found"
            exit 1
          fi

          # Verify cert chain
          openssl verify -untrusted "${CERT_DIR}/chain.pem" "${CERT_DIR}/certificate.pem"
          echo ""

          # Show cert details
          echo "Certificate details:"
          openssl x509 -in "${CERT_DIR}/fullchain.pem" -noout \
            -subject -issuer -dates -ext subjectAltName

          echo ""
          echo "All certificate files:"
          ls -lh "${CERT_DIR}/"

      - name: Upload certificate artifact
        uses: actions/upload-artifact@v4
        with:
          name: letsencrypt-certificate-${{ github.run_number }}
          path: output/certs/
          retention-days: 90
          if-no-files-found: error

      - name: Commit certificate to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add output/certs/
          if git diff --cached --quiet; then
            echo "No certificate changes to commit."
          else
            git commit -m "chore: update Let's Encrypt certificate [skip ci]"
            git push
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Let's Encrypt Certificate Generation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Domains | \`${DOMAINS}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Email | \`${CERTBOT_EMAIL}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Run | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Output Files" >> $GITHUB_STEP_SUMMARY
          echo "- \`certificate.pem\` — Server certificate" >> $GITHUB_STEP_SUMMARY
          echo "- \`private-key.pem\` — Private key" >> $GITHUB_STEP_SUMMARY
          echo "- \`chain.pem\` — Intermediate chain" >> $GITHUB_STEP_SUMMARY
          echo "- \`fullchain.pem\` — Full chain (use this)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download from **Actions → run #${{ github.run_number }} → Artifacts**." >> $GITHUB_STEP_SUMMARY